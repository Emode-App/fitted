# Edge function JWT settings.
# The Stripe webhook is called by Stripe (no Supabase JWT) and verifies its own
# signature, so gateway JWT verification must be OFF for it. Every other function
# requires an authenticated caller — the gateway rejects anonymous requests and
# the function ALSO verifies the JWT in code (defense in depth).

[functions.stripe-webhook]
verify_jwt = false

[functions.create-payment-intent]
verify_jwt = true

[functions.create-connect-account]
verify_jwt = true

# Stripe sends the browser here after onboarding, with no Authorization header
# of its own, so this one has to answer an anonymous request.
[functions.stripe-connect-redirect]
verify_jwt = false

[functions.create-connect-link]
verify_jwt = true

[functions.create-connect-login-link]
verify_jwt = true

[functions.portfolio-decision]
verify_jwt = true

[functions.sync-entitlement]
verify_jwt = true

[functions.ai-proxy]
verify_jwt = true

[functions.product-search]
verify_jwt = true

# The seed jobs are guarded by the x-seed-secret shared secret in the handler
# rather than a user JWT: pg_cron invokes them through pg_net, which carries no
# session. Pinned here because relying on a --no-verify-jwt flag at deploy time
# means the next redeploy that forgets the flag silently turns the crawl off.

[functions.seed-brand-catalog]
verify_jwt = false

[functions.seed-brand-directory]
verify_jwt = false
